# Ground control points for image->world homography (Stage 4, decision_log D4).
#
# HOW TO FILL THIS IN
# 1. Dump the reference frame:
#      python scripts/00_calibrate.py --video data/video_clips/120_m_DJI_0006_1min.mp4 --dump-frame
#    (occluded markings? add --frame N to pick a clearer frame.)
# 2. Open data/video_annotations/calibration/frames/120_m_DJI_0006_1min.png in an
#    image viewer that shows pixel coordinates on hover.
# 3. Pick 6-8 well-SPREAD points on the flat road plane whose real-world
#    spacing you know from road-marking geometry (lane edges, dashed
#    centre-line segment ends, stop-line / crosswalk corners). Spread them
#    across the frame (not clustered) for a stable fit.
# 4. Define a LOCAL metric ground frame: choose one point as origin (0, 0)
#    and give every point's (X, Y) in METRES measured from it along sensible
#    road-aligned axes. Global lat/long is NOT needed -- only relative metric
#    distance matters for kinematics.
# 5. Fit:
#      python scripts/00_calibrate.py --gcp configs/calibration/120_m_DJI_0006_1min.gcp.yaml
#
# REFERENCE DIMENSIONS (CONFIRM ON-SITE / FROM SATELLITE IF POSSIBLE):
#   A globally-wrong reference distance scales ALL speeds/accelerations
#   uniformly and the reprojection RMSE will NOT catch it. Use measured
#   values where you have them. Thai-standard fallbacks:
#     - traffic lane width ......... ~3.0-3.5 m
#     - dashed centre-line segment . confirm (commonly ~3 m segment + ~3 m gap)
#     - crosswalk / stop-line width  confirm on-site
#
clip: 120_m_DJI_0006_1min
reference: "FILL ME: state the exact real-world distances used and their source (measured / satellite / Thai standard)."

# >= 4 points (6-8 recommended). pixel: [u, v] from the reference frame; world: [X, Y] in metres.
points:
  - {name: p1, pixel: [null, null], world: [0.0, 0.0]}
  - {name: p2, pixel: [null, null], world: [null, null]}
  - {name: p3, pixel: [null, null], world: [null, null]}
  - {name: p4, pixel: [null, null], world: [null, null]}
  - {name: p5, pixel: [null, null], world: [null, null]}
  - {name: p6, pixel: [null, null], world: [null, null]}

# OPTIONAL but recommended: an independent scale check. Two pixel points whose
# real separation you know but did NOT use as fit points; the fitter reports
# measured-vs-known distance (the one error RMSE cannot catch).
validation:
  pixel_a: [null, null]
  pixel_b: [null, null]
  known_distance_m: null
