# Nadir-YOLO-s GDP variant training config (design doc §5.2; decision_log D6).
# Identical protocol to nadir_yolo_s.yaml — only the architecture differs —
# so pilot/ablation deltas are attributable to the pyramid change alone.
detector_class: ultralytics
model_name: configs/detectors/arch/nadir_yolo11s_gdp.yaml
pretrained: yolo11s.pt   # backbone P1-P4 + shared-shape head layers transfer; P2 path fresh
data_yaml: data/splits/dataset.yaml
epochs: 100
imgsz: 1280
batch: 3
# batch=3, NOT 8: the P2 level at 1280 quadruples the anchor count
# (320^2 + 160^2 + 80^2 vs 160^2 + 80^2 + 40^2 grid cells), and TAL
# assignment memory spikes with per-frame instance count (mosaic packs
# >1200 objects). Observed 2026-06-12 pilots: batch=8 -> ~45 GB; batch=4
# -> 30 GB early but 40+ GB mid-epoch on dense batches (silent WDDM
# spillover, erratic ~6x slowdowns, 32 GB card). Same intrinsic-exception
# pattern as YOLO12m batch=4 in Stage 1 (decision_log 2026-05-08 /
# 2026-05-16); Ultralytics nbs=64 keeps effective LR consistent.
cuda_mem_fraction: 0.9
# Hard VRAM cap (fail fast instead of silent shared-memory spillover).
# If a capped run OOMs at batch=3, drop to batch=2 rather than raising
# the cap; if batch=2 still OOMs, the P2 head needs slimming (Phase 1
# design change), not more memory.
patience: 20
cos_lr: true
seed: 0
workers: 4
device: 0
project: runs/nadir_yolo
name: nadir_yolo_s_gdp_seed{seed}
notes: "Nadir-YOLO GDP (P2-P4 pyramid) — ablation arm vs the stock-pyramid scaffold."
