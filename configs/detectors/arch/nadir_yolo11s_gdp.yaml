# Nadir-YOLO GDP variant — GSD-Derived Pyramid (design doc §5.2).
#
# Detection levels P2/P3/P4 (strides 4/8/16) instead of stock P3/P4/P5,
# derived analytically from effective GSD x vehicle physical-size bounds at
# imgsz=1280 (effective GSD 0.090/0.120 m/px at 100/120 m):
#   SV motorcycle ~2 m   -> 17-22 px  (needs P2; P3 marginal)
#   MV car        ~4.5 m -> 37-50 px  (P3)
#   LV truck/bus  ~8-12 m -> 67-133 px (P4; 133 px borderline P4/P5 --
#                            LV AP is the canary for dropping P5)
# No vehicle approaches P5's ~256 px regime, so the P5 tier (the 1024-wide
# layers = ~45% of YOLO11s parameters) is removed; SPPF/C2PSA move to P4.
# Measured vs the stock scaffold (nc=3): 2.86M vs 9.43M params (-70%),
# 94.0 vs 86.2 GFLOPs @1280 (+9%).
#
# Phase 1 pilot variant — keep/cut decided by ablation (decision_log D6).

# Parameters
nc: 3 # LV, MV, SV
scales: # model compound scaling constants ("...11s" filename -> scale 's')
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# backbone (stock YOLO11 through P4; P5 tier removed, SPPF/C2PSA at P4)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, SPPF, [512, 5]] # 7
  - [-1, 2, C2PSA, [512]] # 8

# head (PAFPN over P2/P3/P4)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 11 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 14 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 20 (P4/16)

  - [[14, 17, 20], 1, Detect, [nc]] # Detect(P2, P3, P4)
