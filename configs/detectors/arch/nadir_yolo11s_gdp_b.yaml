# Nadir-YOLO GDP variant B — P2 added, full P3-P5 pyramid kept (design doc §5.2).
#
# Variant A (P2-P4, nadir_yolo11s_gdp.yaml) lost everywhere at the 30-epoch
# pilot (2026-06-12): LV AP50-95 -0.077 — the P5 canary fired, and the size
# analysis with honest LV bounds agrees (trailers run 16-18 m ~= 200 px at
# 100 m / imgsz 1280: unambiguous P5 territory; the original 8-12 m bound
# ignored trailers). SV (-0.044) is confounded by variant A's from-scratch
# head (128/409 transfer).
#
# Variant B isolates the P2 question: stock YOLO11 backbone + stock head
# layers 11-16 (both transfer from COCO), one extra P2 branch, Detect over
# P2/P3/P4/P5. No slimming — capacity reduction is a separate later variant
# so each pilot changes one variable.

# Parameters
nc: 3 # LV, MV, SV
scales: # model compound scaling constants ("...11s" filename -> scale 's')
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# backbone (stock YOLO11)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# head (stock through layer 16, then the P2 branch, then re-descend)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
