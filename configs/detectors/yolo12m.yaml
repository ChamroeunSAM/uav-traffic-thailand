# Full benchmark — YOLO12-medium @ 1280px, 100 epochs (early stop @20).
detector_class: ultralytics
model_name: yolo12m.pt
data_yaml: data/splits/dataset.yaml
epochs: 100
imgsz: 1280
batch: 4
# Fixed batch=4 — area-attention memory constraint at imgsz=1280 (extpilot at 16GB
# with batch=8 OOM'd; batch=4 ran at 22.3GB peak with shared-memory spillover).
# Even on 32GB, batch=8 would be tight. See docs/decision_log.md.
patience: 20
seed: 0
workers: 4
device: 0
project: runs/stage1_detectors
name: yolo12m_seed{seed}
notes: "Full benchmark — YOLO12-m, 5 seeds (0..4), cosine LR, native augs."
