# Full benchmark — RT-DETR-L @ 1280px, 100 epochs (early stop @20).
# Zhao et al. CVPR 2024 (real-time DETR). Replaces RF-DETR after it was found
# to top out at 704px native; see docs/decision_log.md (2026-05-08 entry).
detector_class: ultralytics
model_name: rtdetr-l.pt
data_yaml: data/splits/dataset.yaml
epochs: 100
imgsz: 1280
batch: 8
# Fixed batch=8 — fits on 32GB benchmark hardware (verified via extpilot at 16GB/batch=4 → 11.8GB peak).
# See docs/decision_log.md for per-detector batch-size rationale.
patience: 20
cos_lr: true   # explicit cosine LR schedule (matches methods-section claim)
seed: 0
workers: 4
device: 0
project: runs/stage1_detectors
name: rtdetr_l_seed{seed}
notes: "Full benchmark — RT-DETR-L (transformer), 5 seeds (0..4), cosine LR, native augs."
