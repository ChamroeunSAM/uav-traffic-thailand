# Full benchmark — RF-DETR-medium @ 1280px, 100 epochs (early stop @20).
# Smaller batch (4) than YOLO variants because the transformer is heavier on a
# 16 GB card. grad_accum_steps gives an effective batch of 16 to match RF-DETR's
# default training regime.
detector_class: rfdetr
model_name: rfdetr_m
data_yaml: data/splits/dataset.yaml
epochs: 100
imgsz: 1280
batch: 4
# Fixed batch size for fair cross-detector comparison.
# See docs/decision_log.md for rationale.
grad_accum_steps: 4
patience: 20
seed: 0
workers: 4
device: cuda:0
lr_scheduler: cosine
class_names:
  - car
  - motorcycle
  - truck
project: runs/stage1_detectors
name: rfdetr_m_seed{seed}
notes: "Full benchmark — RF-DETR-medium, 5 seeds (0..4), cosine LR, native augs."
