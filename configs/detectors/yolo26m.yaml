# Full benchmark — YOLO26-medium @ 1280px, 100 epochs (early stop @20).
detector_class: ultralytics
model_name: yolo26m.pt
data_yaml: data/splits/dataset.yaml
epochs: 100
imgsz: 1280
batch: 8
# Fixed batch=8 — fits on 32GB benchmark hardware (extpilot at batch=4 peaked
# 12.5GB on 16GB without spillover; batch=8 should fit on 32GB with margin).
# See docs/decision_log.md for per-detector batch-size rationale.
patience: 20
seed: 0
workers: 4
device: 0
project: runs/stage1_detectors
name: yolo26m_seed{seed}
notes: "Full benchmark — YOLO26-m, 5 seeds (0..4), cosine LR, native augs."
