# Nadir-YOLO MSP route (ii-A) — known-GSD input channel (design doc §8d).
# Full 100-ep protocol, native dataset (NO crop/resize — route ii feeds full
# images + GSD), matching the baseline scaffold (nadir_yolo_s) exactly except
# for the 4th GSD input channel. Matched control = nadir_yolo_s at the same
# seed. data yaml carries channels:4 (model build + warmup); loader still reads
# 3ch, GSD plane appended in MSPTrainer/MSPValidator preprocess.
detector_class: ultralytics
model_name: configs/detectors/arch/nadir_yolo11s.yaml
pretrained: yolo11s.pt
data_yaml: configs/data/dataset_msp4ch.yaml
msp_mode: ii_a
epochs: 100
imgsz: 1280
batch: 8
patience: 20
cos_lr: true
cuda_mem_fraction: 0.9
seed: 0
workers: 4
device: 0
project: runs/nadir_yolo
name: nadir_msp_iia_seed{seed}
notes: "MSP ii-A: GSD 4th input channel, full 100ep; A/B vs nadir_yolo_s."
